<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Choir Player — 2025 성탄 찬양 연습 음원 플레이어</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="logo">
      <svg viewBox="0 0 24 24" class="logo-icon" aria-hidden>
        <path fill="currentColor" d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/>
      </svg>
      <h1>합창 음원 모음</h1>
    </div>
    <p class="lead">파트별로 재생하려면 버튼을 누르세요.</p>
    <div id="statsToggle" class="stats-toggle" title="열심히 연습하고 있는 곡과 파트">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-activity"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
    </div>
  </header>

  <div id="statsModal" class="modal" style="display: none;">
    <div class="modal-content">
      <span class="close-button">&times;</span>
      <div id="playStats" class="play-stats"></div>
    </div>
  </div>

  <main class="container">
    <!-- 플레이어: 각 파트 아래에 개별 HTML5 플레이어가 생성됩니다 -->

    <div id="songs" class="songs">
      <!-- Songs will be statically included below -->

      <article class="song">
        <h2>1. 장 라신의의 찬가</h2>
        <div class="parts">
          <button class="part soprano" data-src="audio/01_soprano.m4a">소프라노</button>
          <button class="part alto" data-src="audio/01_alto.m4a">알토</button>
          <button class="part tenor" data-src="audio/01_tenor.m4a">테너</button>
          <button class="part bass" data-src="audio/01_bass.m4a">베이스</button>
        </div>
      </article>

      <article class="song">
        <h2>2. 성탄의 기적</h2>
        <div class="parts">
          <button class="part soprano1" data-src="audio/02_soprano1.m4a">소프라노1</button>
          <button class="part soprano2" data-src="audio/02_soprano2.m4a">소프라노2</button>
          <button class="part alto1" data-src="audio/02_alto1.m4a">알토1</button>
          <button class="part alto2" data-src="audio/02_alto2.m4a">알토2</button>
          <button class="part tenor" data-src="audio/02_tenor.m4a">테너</button>
          <button class="part bass1" data-src="audio/02_bass1.m4a">베이스1</button>
          <button class="part bass2" data-src="audio/02_bass2.m4a">베이스2</button>
        </div>
      </article>

      <article class="song">
        <h2>3. 하늘의 찬송</h2>
        <div class="parts">
          <button class="part full" data-src="audio/03_full.m4a">전체 (S.A.T.B)</button>
        </div>
      </article>

      <article class="song">
        <h2>5. 천사 찬송하기를</h2>
        <div class="parts">
          <button class="part soprano1" data-src="audio/05_soprano1.m4a">소프라노1</button>
          <button class="part soprano2" data-src="audio/05_soprano2.m4a">소프라노2</button>
          <button class="part alto" data-src="audio/05_alto.m4a">알토</button>
          <button class="part tenor" data-src="audio/05_tenor.m4a">테너</button>
          <button class="part bass" data-src="audio/05_bass.m4a">베이스</button>
        </div>
      </article>

      <article class="song">
        <h2>6. Laudate Dominum (여호와를 찬양할지어다)</h2>
        <div class="parts">
          <button class="part soprano" data-src="audio/06_soprano.m4a">소프라노</button>
          <button class="part alto" data-src="audio/06_alto.m4a">알토</button>
          <button class="part tenor" data-src="audio/06_tenor.m4a">테너</button>
          <button class="part bass" data-src="audio/06_bass.m4a">베이스</button>
        </div>
      </article>

      <article class="song">
        <h2>7. Gloria</h2>
        <div class="parts">
          <button class="part soprano1" data-src="audio/07_soprano1.m4a">소프라노1</button>
          <button class="part soprano2" data-src="audio/07_soprano2.m4a">소프라노2</button>
          <button class="part alto1" data-src="audio/07_alto1.m4a">알토1</button>
          <button class="part alto2" data-src="audio/07_alto2.m4a">알토2</button>
          <button class="part tenor1" data-src="audio/07_tenor1.m4a">테너1</button>
          <button class="part tenor2" data-src="audio/07_tenor2.m4a">테너2</button>
          <button class="part bass1" data-src="audio/07_bass1.m4a">베이스1</button>
          <button class="part bass2" data-src="audio/07_bass2.m4a">베이스2</button>
        </div>
      </article>

      <article class="song">
        <h2>8. 우리는 주의 영광을 보았네</h2>
        <div class="parts">
          <button class="part soprano1" data-src="audio/08_soprano1.m4a">소프라노1</button>
          <button class="part soprano2" data-src="audio/08_soprano2.m4a">소프라노2</button>
          <button class="part tenor" data-src="audio/08_tenor.m4a">테너</button>
          <button class="part alto" data-src="audio/08_alto.m4a">알토</button>
          <button class="part bass1" data-src="audio/08_bass1.m4a">베이스1</button>
          <button class="part bass2" data-src="audio/08_bass2.m4a">베이스2</button>
        </div>
      </article>

      <article class="song">
        <h2>9. 주의 기도</h2>
        <div class="parts">
          <button class="part soprano" data-src="audio/09_soprano.m4a">소프라노</button>
          <button class="part alto" data-src="audio/09_alto.m4a">알토</button>
          <button class="part tenor" data-src="audio/09_tenor.m4a">테너</button>
          <button class="part bass" data-src="audio/09_bass.m4a">베이스</button>
        </div>
      </article>

      <article class="song">
        <h2>10. I was glad (시편 122편)</h2>
        <div class="parts">
          <button class="part soprano1" data-src="audio/10_soprano1.m4a">소프라노1</button>
          <button class="part soprano2" data-src="audio/10_soprano2.m4a">소프라노2</button>
          <button class="part alto1" data-src="audio/10_alto1.m4a">알토1</button>
          <button class="part alto2" data-src="audio/10_alto2.m4a">알토2</button>
          <button class="part tenor1" data-src="audio/10_tenor1.m4a">테너1</button>
          <button class="part tenor2" data-src="audio/10_tenor2.m4a">테너2</button>
          <button class="part bass1" data-src="audio/10_bass1.m4a">베이스1</button>
          <button class="part bass2" data-src="audio/10_bass2.m4a">베이스2</button>
        </div>
      </article>

    </div>

    <audio id="audio" preload="none"></audio>
  </main>

  <footer class="site-footer">
    <p>2025년 성탄 연합 찬양</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
