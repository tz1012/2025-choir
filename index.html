<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Choir Player — 합창 음원 플레이어</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="logo">
      <svg viewBox="0 0 24 24" class="logo-icon" aria-hidden>
        <path fill="currentColor" d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/>
      </svg>
      <h1>합창 음원 모음</h1>
    </div>
    <p class="lead">파트별로 재생하려면 버튼을 누르세요. 모바일에서도 사용하기 쉬운 UI.</p>
  </header>

  <main class="container">
    <!-- 플레이어: 각 파트 아래에 개별 HTML5 플레이어가 생성됩니다 -->

    <div id="songs" class="songs">
      <!-- Songs will be statically included below -->

      <article class="song">
        <h2>1. 장 라신의의 찬가</h2>
        <div class="parts">
          <button class="part soprano" data-src="https://drive.google.com/uc?export=download&id=19D4apRUYZ4oUelcJb8FZkTehJ1gWebH2">소프라노</button>
          <button class="part alto" data-src="https://drive.google.com/uc?export=download&id=1qreyj2PP6BCHgIAAorAdolXTaUu643Wo">알토</button>
          <button class="part tenor" data-src="https://drive.google.com/uc?export=download&id=1bHZXiDHH6sbAn606FXtiR9sWtHe_BJYh">테너</button>
          <button class="part bass" data-src="https://drive.google.com/uc?export=download&id=1baNOE7PxcbDzuI0D_BjkPWOgyPmu7ID9">베이스</button>
        </div>
      </article>

      <article class="song">
        <h2>2. 성탄의 기적</h2>
        <div class="parts">
          <button class="part soprano1" data-src="https://drive.google.com/uc?export=download&id=1cJmMeFuxISsZxvktQtV02P_EAqHkoVN0">소프라노1</button>
          <button class="part soprano2" data-src="https://drive.google.com/uc?export=download&id=1bBpB-cT_rToRqSsVxtnMjwehnkoopgaN">소프라노2</button>
          <button class="part alto1" data-src="https://drive.google.com/uc?export=download&id=1cGGt9jWrb5wEdWPOXshogeEuNRjLCgVu">알토1</button>
          <button class="part alto2" data-src="https://drive.google.com/uc?export=download&id=1iRonvofn2X88z5s1708L1-3rCpIO7hLH">알토2</button>
          <button class="part bass1" data-src="https://drive.google.com/uc?export=download&id=1QqO3zA1rznfvhDcoFTb2Fw6ZdJg0Ezks">베이스1</button>
          <button class="part bass2" data-src="https://drive.google.com/uc?export=download&id=1SLIWPAcIIoJRnGMKDX0tJUrMlm9axDDO">베이스2</button>
        </div>
      </article>

      <article class="song">
        <h2>3. 하늘의 찬송</h2>
        <div class="parts">
          <button class="part full" data-src="https://drive.google.com/uc?export=download&id=1SdyZE6QrvYpzEFfXkY-FK_WCCBWTp9mE">전체 (S.A.T.B)</button>
        </div>
      </article>

      <article class="song">
        <h2>5. 천사 찬송하기를</h2>
        <div class="parts">
          <button class="part soprano1" data-src="https://drive.google.com/uc?export=download&id=1qBVZOoFVHBZcymLP7_zjfDOJJsExpXq0">소프라노1</button>
          <button class="part alto" data-src="https://drive.google.com/uc?export=download&id=1CvvH2BVFtgFBSvq1a5KZU3YspCxQeN6B">알토</button>
          <button class="part tenor" data-src="https://drive.google.com/uc?export=download&id=1frZs-m0U9qpOEwFK-ghLnas4LY-jug0X">테너</button>
          <button class="part bass" data-src="https://drive.google.com/uc?export=download&id=1fozujaJJJfkeZbF_avWmES7Lh2x2Gtha">베이스</button>
        </div>
      </article>

      <article class="song">
        <h2>6. Laudate Dominum (여호와를 찬양할지어다)</h2>
        <div class="parts">
          <button class="part soprano" data-src="https://drive.google.com/uc?export=download&id=1NAGqRC5IDoqKLfTtl3oq81ZvBAIOMcJq">소프라노</button>
          <button class="part alto" data-src="https://drive.google.com/uc?export=download&id=1wJAxsxpD11NOa0fBUcgKISVn2Oqa1zo6">알토</button>
          <button class="part tenor" data-src="https://drive.google.com/uc?export=download&id=1nMyhuxuvZtF2iVSyRaoBAl1J18QBNx0s">테너</button>
          <button class="part bass" data-src="https://drive.google.com/uc?export=download&id=1Yblac3mxdQrzBwbVEj1Sg8b1ABxXRAcE">베이스</button>
        </div>
      </article>

      <article class="song">
        <h2>7. Gloria</h2>
        <div class="parts">
          <button class="part soprano1" data-src="https://drive.google.com/uc?export=download&id=1u7OtiQ3H-vPZeqcSmvxC7qXPGhCUlLAX">소프라노1</button>
          <button class="part soprano2" data-src="https://drive.google.com/uc?export=download&id=1xOeghua1jowg-pb_dyGaayNBy_nJIC9X">소프라노2</button>
          <button class="part alto1" data-src="https://drive.google.com/uc?export=download&id=1LpGf71hr3Bu-mO-cYQ1jOTamkW-pncCG">알토1</button>
          <button class="part tenor1" data-src="https://drive.google.com/uc?export=download&id=1fxjYr3sUvj434-OZ81CMw1QLQS3USdeY">테너1</button>
          <button class="part tenor2" data-src="https://drive.google.com/uc?export=download&id=1bxpkhy4-ac2rKL_TbXEoW9C6eHOIaXtX">테너2</button>
          <button class="part bass1" data-src="https://drive.google.com/uc?export=download&id=1lHDK_2wwt3FTmLrk_T6zWPe4kSk6ee3z">베이스1</button>
          <button class="part bass2" data-src="https://drive.google.com/uc?export=download&id=1adTqyG7OBysqvO6IIRLTvkTHPmnttNXz">베이스2</button>
        </div>
      </article>

      <article class="song">
        <h2>8. 우리는 주의 영광을 보았네</h2>
        <div class="parts">
          <button class="part soprano2" data-src="https://drive.google.com/uc?export=download&id=1mCF0XUEK6zppVHb5n0r8IKasJdAYY-1Y">소프라노2</button>
          <button class="part alto" data-src="https://drive.google.com/uc?export=download&id=1S1Tbtj3V41CgZU5u4LLZ5D3_90WgiuTJ">알토</button>
          <button class="part bass1" data-src="https://drive.google.com/uc?export=download&id=1N0RnQpgxA9RTBE8Z59hwCwD81Cwt_wzN">베이스1</button>
          <button class="part bass2" data-src="https://drive.google.com/uc?export=download&id=1hvX6kNkFnOPmzw_2zDgjyTq4ME58HpzV">베이스2</button>
        </div>
      </article>

      <article class="song">
        <h2>9. 주의 기도</h2>
        <div class="parts">
          <button class="part soprano" data-src="https://drive.google.com/uc?export=download&id=1bRJH9f6dgQmoGxJU8X9e-LZ6zRjvPmyc">소프라노</button>
          <button class="part alto" data-src="https://drive.google.com/uc?export=download&id=1LhBcwXu-jiilii_1Dhu15DFrXtp4zIOd">알토</button>
          <button class="part tenor" data-src="https://drive.google.com/uc?export=download&id=1jlYCPfC4EzXVNVwIheG4pIP75RfjQ0DN">테너</button>
        </div>
      </article>

      <article class="song">
        <h2>10. I was glad (시편 122편)</h2>
        <div class="parts">
          <button class="part soprano1" data-src="https://drive.google.com/uc?export=download&id=1Wh7zA4NSZfQJicA4P_uqiKS2WdaKZDZ-">소프라노1</button>
          <button class="part soprano2" data-src="https://drive.google.com/uc?export=download&id=1ytUSTpDovYRZDIh6EAsf7a0l0wcK-IiQ">소프라노2</button>
          <button class="part alto2" data-src="https://drive.google.com/uc?export=download&id=1fXr9rgtHyzqfAillN-zgVuPYpq7YLZxy">알토2</button>
          <button class="part tenor1" data-src="https://drive.google.com/uc?export=download&id=1uaexyDzJHMMLiH5341A7EgM89LpvIVEr">테너1</button>
          <button class="part tenor2" data-src="https://drive.google.com/uc?export=download&id=1cw1HLr15GDjn0tBxXi10_kHS4WALgjm1">테너2</button>
          <button class="part bass1" data-src="https://drive.google.com/uc?export=download&id=1Wrc1PXaFuSuS--LjxkqvF4cRAF32vlev">베이스1</button>
          <button class="part bass2" data-src="https://drive.google.com/uc?export=download&id=1ZC4cwyHrI3pkrDx2pCtjKAkMx1wUKXEJ">베이스2</button>
        </div>
      </article>

    </div>

    <audio id="audio" preload="none"></audio>
  </main>

  <footer class="site-footer">
    <p>GitHub Pages에 업로드하여 무료로 배포하세요. © 합창</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
